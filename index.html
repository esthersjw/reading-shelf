<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>不二的书架 — 心理学书库知识网络</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fefcf6;--blue:#2B7FD8;--yellow:#F4D758;--mix:#8FBAE6;
  --card-shadow:0 8px 40px rgba(0,0,0,.1);
  --text:#1a1a1a;--text-secondary:#666;--text-light:#999;
  --radius:16px;
}
html{scroll-behavior:smooth}
body{
  font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ===== HEADER ===== */
.header{
  position:sticky;top:0;z-index:200;background:var(--bg);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:12px}
.header-avatar{
  width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid var(--yellow);
}
.header-title{
  font-family:'Playfair Display','PingFang SC','Noto Sans SC',serif;font-size:26px;font-weight:700;
  color:var(--blue);letter-spacing:-.5px;
}
.header-tabs{display:flex;gap:4px;align-items:center}
.tab-btn{
  padding:8px 18px;border-radius:24px;border:none;cursor:pointer;
  font-size:14px;font-weight:500;background:transparent;color:var(--text-secondary);
  transition:all .25s;font-family:inherit;
}
.tab-btn:hover{background:rgba(43,127,216,.06)}
.tab-btn.active{background:var(--blue);color:#fff}

/* Add book button */
.add-book-btn{
  padding:8px 16px;border-radius:24px;border:1.5px dashed var(--blue);
  cursor:pointer;font-size:13px;font-weight:500;
  background:transparent;color:var(--blue);
  transition:all .25s;font-family:inherit;margin-left:8px;
}
.add-book-btn:hover{background:var(--blue);color:#fff}

/* ===== MAIN ===== */
.main{max-width:1200px;margin:0 auto;padding:24px 24px 80px}

/* ===== FILTER TAGS ===== */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;
}
.filter-tag{
  padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
  font-size:12px;font-weight:500;font-family:inherit;
  background:rgba(0,0,0,.05);color:var(--text-secondary);
  transition:all .25s;
}
.filter-tag.active{color:#fff}

/* ===== BOOK GRID ===== */
.book-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
}
@media(max-width:900px){.book-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.book-grid{grid-template-columns:1fr}}

.book-card{
  background:#fff;border-radius:12px;cursor:pointer;position:relative;
  transition:transform .2s,box-shadow .2s;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
  display:flex;flex-direction:column;
}
.book-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.1)}
.book-card .card-inner{padding:20px 18px 14px;flex:1}
.book-card h3{
  font-size:19px;font-weight:700;line-height:1.35;margin-bottom:4px;
}
.book-card .author{font-size:12px;color:#bbb;margin-bottom:12px}
.book-card .verdict{
  font-size:14.5px;color:#555;line-height:1.8;margin-bottom:0;
}
.book-card .card-bottom{
  padding:10px 18px;
  display:flex;justify-content:space-between;align-items:center;
}
.book-card .category-badge{
  font-size:11px;font-weight:600;letter-spacing:.3px;
  position:static;padding:0;border-radius:0;
  background:none;
}
.book-card .tags{display:flex;flex-wrap:wrap;gap:4px}
.book-card .tag{
  font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;
}

/* Category-specific bottom bar & tag colors */
.book-card[data-cat="心理学"] .card-bottom{background:rgba(43,127,216,.05)}
.book-card[data-cat="心理学"] .category-badge{color:#2B7FD8}
.book-card[data-cat="心理学"] .tag{color:#2B7FD8;background:rgba(43,127,216,.1)}

.book-card[data-cat="个人成长"] .card-bottom{background:rgba(244,215,88,.08)}
.book-card[data-cat="个人成长"] .category-badge{color:#8a6d00}
.book-card[data-cat="个人成长"] .tag{color:#8a6d00;background:rgba(244,215,88,.2)}

.book-card[data-cat="商业"] .card-bottom{background:rgba(74,159,216,.05)}
.book-card[data-cat="商业"] .category-badge{color:#3a7fb8}
.book-card[data-cat="商业"] .tag{color:#3a7fb8;background:rgba(74,159,216,.1)}

.book-card[data-cat="设计"] .card-bottom{background:rgba(122,184,232,.06)}
.book-card[data-cat="设计"] .category-badge{color:#4a8ab8}
.book-card[data-cat="设计"] .tag{color:#4a8ab8;background:rgba(122,184,232,.12)}

.book-card[data-cat="女性"] .card-bottom{background:rgba(232,200,74,.06)}
.book-card[data-cat="女性"] .category-badge{color:#8a6d00}
.book-card[data-cat="女性"] .tag{color:#8a6d00;background:rgba(232,200,74,.15)}

.book-card[data-cat="文学"] .card-bottom{background:rgba(91,175,208,.05)}
.book-card[data-cat="文学"] .category-badge{color:#3a8faa}
.book-card[data-cat="文学"] .tag{color:#3a8faa;background:rgba(91,175,208,.1)}

/* Delete button */
.book-card .delete-btn{
  position:absolute;top:8px;right:8px;
  width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(0,0,0,.06);color:var(--text-light);
  cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s,background .2s;z-index:10;
}
.book-card:hover .delete-btn{opacity:1}
.book-card .delete-btn:hover{background:rgba(200,50,50,.15);color:#c33}

/* Category badge colors */

/* Tag colors per category */

/* ===== ADD BOOK MODAL ===== */
.add-modal-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.45);
  display:flex;justify-content:center;align-items:center;
  padding:40px 20px;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s;
}
.add-modal-overlay.open{opacity:1;pointer-events:auto}
.add-modal{
  background:var(--bg);border-radius:var(--radius);padding:36px 32px;
  width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2);
  position:relative;
}
.add-modal h2{
  font-size:20px;font-weight:700;margin-bottom:24px;color:var(--text);
}
.add-modal label{
  display:block;font-size:13px;font-weight:500;color:var(--text-secondary);
  margin-bottom:6px;
}
.add-modal input{
  width:100%;padding:10px 14px;border:1.5px solid rgba(0,0,0,.1);
  border-radius:10px;font-size:14px;font-family:inherit;
  background:#fff;margin-bottom:16px;transition:border-color .2s;
}
.add-modal input:focus{outline:none;border-color:var(--blue)}
.add-modal .ai-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:var(--blue);color:#fff;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:opacity .2s;
}
.add-modal .ai-btn:hover{opacity:.9}
.add-modal .ai-btn:disabled{opacity:.5;cursor:not-allowed}
.add-modal .ai-btn.loading{
  background:linear-gradient(90deg,var(--blue),var(--mix),var(--blue));
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.add-modal .close-add{
  position:absolute;top:16px;right:16px;width:32px;height:32px;
  border-radius:50%;border:none;background:rgba(0,0,0,.06);
  cursor:pointer;font-size:16px;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;
}
.add-modal .error-msg{
  font-size:12px;color:#c33;margin-top:8px;display:none;
}

/* ===== MODAL (SCROLL BOOK) ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,0.45);
  display:flex;justify-content:center;
  padding:40px 20px;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s;
  overflow-y:auto;
}
.modal-overlay.open{opacity:1;pointer-events:auto}

/* Close button */
.close-btn{
  position:fixed;top:20px;right:24px;
  width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(254,252,246,0.9);backdrop-filter:blur(8px);
  cursor:pointer;font-size:20px;color:#8a8580;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,0.15);z-index:1010;
  transition:transform 0.2s;
}
.close-btn:hover{transform:scale(1.1)}

/* Scroll container */
.book-scroll{
  width:100%;max-width:640px;position:relative;
}

/* Sections */
.book-section{
  background:var(--bg);padding:48px 44px;margin-bottom:2px;position:relative;
}
.book-section:first-child{border-radius:16px 16px 0 0}
.book-section:last-child{border-radius:0 0 16px 16px;margin-bottom:0}

/* Cover */
.cover-section{padding:64px 44px;text-align:center}
.section-label{
  font-family:'DM Sans',sans-serif;font-size:0.6875rem;font-weight:600;
  letter-spacing:0.2em;text-transform:uppercase;color:var(--blue);margin-bottom:32px;
}
.book-title{
  font-family:'Playfair Display','PingFang SC','Noto Sans SC',serif;
  font-size:1.75rem;font-weight:600;line-height:1.4;color:#2a2520;margin-bottom:12px;
}
.book-author{
  font-family:'DM Sans','PingFang SC','Noto Sans SC',sans-serif;
  font-size:0.8125rem;font-style:italic;color:#8a8580;margin-bottom:32px;
}
.book-verdict{
  font-family:'DM Sans','PingFang SC','Noto Sans SC',sans-serif;
  font-size:0.875rem;line-height:1.8;color:#4a4540;
  max-width:480px;margin:0 auto 28px;
  border-left:2px solid var(--blue);padding-left:16px;text-align:left;
}
.book-tags{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.book-tags .tag{
  font-family:'DM Sans',sans-serif;font-size:0.6875rem;font-weight:500;
  letter-spacing:0.08em;color:var(--blue);
  padding:4px 14px;border:1.5px solid var(--blue);border-radius:20px;
}

/* Highlights */
.highlights-section{border-top:1px solid rgba(42,37,32,0.06)}
.b-section-label{
  font-family:'DM Sans',sans-serif;font-size:0.5625rem;font-weight:700;
  letter-spacing:0.25em;text-transform:uppercase;color:var(--blue);
  margin-bottom:16px;padding-bottom:6px;
  border-bottom:2px solid var(--blue);display:inline-block;
}
.highlights-content{
  font-family:'DM Sans','Noto Sans SC',sans-serif;
  font-size:0.8125rem;line-height:1.8;color:#4a4540;
  padding-left:14px;border-left:2px solid var(--yellow);
}

/* Chapter */
.chapter-section{border-top:1px solid rgba(42,37,32,0.06)}
.chapter-name{
  font-family:'DM Sans',sans-serif;font-size:0.625rem;font-weight:600;
  letter-spacing:0.2em;text-transform:uppercase;color:#8a8580;
  margin-bottom:32px;padding-bottom:8px;
  border-bottom:1px solid rgba(42,37,32,0.08);
}

/* Insight block */
.insight-block{margin-bottom:40px}
.insight-block:last-child{margin-bottom:0}
.insight-point{
  font-family:'Playfair Display','PingFang SC','Noto Sans SC',serif;
  font-size:1.125rem;font-weight:600;line-height:1.5;color:#2a2520;margin-bottom:14px;
}
.insight-explanation{
  font-family:'DM Sans','Noto Sans SC',sans-serif;
  font-size:0.8125rem;line-height:1.8;color:#4a4540;margin-bottom:14px;
}
.insight-example{
  font-family:'DM Sans','Noto Sans SC',sans-serif;
  font-size:0.75rem;line-height:1.75;color:#8a8580;
  border:1.5px dashed rgba(42,37,32,0.15);padding:16px 20px;border-radius:4px;
  margin-bottom:14px;position:relative;
}
.insight-example::before{
  content:'';position:absolute;top:-4px;right:-4px;
  width:14px;height:14px;background:var(--yellow);
}
.insight-keywords{display:flex;gap:10px;flex-wrap:wrap}
.kw{
  font-family:'DM Sans',sans-serif;font-size:0.625rem;font-weight:500;
  letter-spacing:0.08em;color:var(--blue);opacity:0.6;
}

/* End */
.end-section{text-align:center;padding:64px 44px;border-top:1px solid rgba(42,37,32,0.06)}
.end-emoji{font-size:2.5rem;margin-bottom:12px}

/* Scroll modal responsive */
@media(max-width:640px){
  .modal-overlay{padding:20px 12px}
  .book-section{padding:36px 28px}
  .cover-section{padding:48px 28px}
  .book-title{font-size:1.5rem}
}

/* ===== MOBILE ===== */
@media(max-width:480px){
  body{font-size:14px}
  
  /* Header */
  .header{
    padding:0 16px;height:56px;
    flex-direction:column;align-items:flex-start;
    height:auto;padding:12px 16px;gap:10px;
  }
  .header-left{gap:8px}
  .header-avatar{width:32px;height:32px}
  .header-title{font-size:20px}
  .header-tabs{gap:2px;width:100%;justify-content:flex-start;flex-wrap:wrap}
  .tab-btn{padding:6px 12px;font-size:12px}
  .add-book-btn{padding:6px 10px;font-size:11px;margin-left:4px}
  
  /* Main content */
  .main{padding:16px 12px 60px}
  
  /* Filter bar */
  .filter-bar{gap:6px;margin-bottom:14px}
  .filter-tag{padding:5px 10px;font-size:11px}
  
  /* Book cards */
  .book-grid{gap:14px}
  .book-card{border-radius:12px}
  .book-card .card-inner{padding:22px 18px 18px}
  .book-card h3{font-size:18px;margin-bottom:5px}
  .book-card .author{font-size:12px;margin-bottom:14px}
  .book-card .verdict{font-size:14px;line-height:1.85}
  .book-card .card-bottom{padding:11px 18px}
  .book-card .category-badge{font-size:11px}
  .book-card .tags{gap:5px}
  .book-card .tag{font-size:10px;padding:3px 9px}
  .book-card .delete-btn{display:none}
  
  /* Network filter */
  .network-filter-bar{gap:6px;margin-bottom:12px}
  .network-filter-bar .nf-tag{padding:5px 10px;font-size:11px}
  
  /* Network SVG */
  .network-svg{min-height:400px}
  
  /* Keyword popup */
  .kw-popup{
    max-width:92vw;max-height:75vh;
    padding:18px 16px;border-radius:14px;
  }
  .kw-popup h3{font-size:15px;margin-bottom:12px}
  .kw-popup .kw-point{font-size:13px}
  .kw-popup .kw-source{font-size:11px}
  
  /* Book detail modal */
  .modal-overlay{padding:10px 8px}
  .book-section{padding:28px 18px}
  .cover-section{padding:36px 18px}
  .book-title{font-size:1.25rem}
  .book-author{font-size:0.75rem}
  .book-verdict{font-size:0.8rem;padding-left:12px}
  .book-tags .tag{font-size:0.6rem;padding:3px 10px}
  .insight-point{font-size:1rem}
  .insight-explanation{font-size:0.75rem}
  .insight-example{font-size:0.7rem;padding:12px 14px}
  .section-label{font-size:0.6rem}
  .b-section-label{font-size:0.5rem}
  .chapter-name{font-size:0.55rem}
  
  /* Close button */
  .close-btn{width:34px;height:34px;font-size:16px;top:12px;right:12px}
  
  /* Add book modal */
  .add-modal{padding:28px 20px;border-radius:14px}
  .add-modal h2{font-size:17px}
  .add-modal input{padding:9px 12px;font-size:13px}
  .add-modal .ai-btn{padding:10px;font-size:13px}
}

/* ===== NETWORK TAB ===== */
.network-container{width:100%;position:relative}
.network-svg{width:100%;background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow)}

/* Network keyword popup */
.kw-popup{
  position:fixed;z-index:1001;background:#fff;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px 24px 20px;
  max-width:480px;width:90vw;max-height:70vh;overflow-y:auto;
  display:none;
}
.kw-popup.open{display:block}
.kw-popup-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.35);
  display:none;
}
.kw-popup-overlay.open{display:block}
.kw-popup h3{font-size:17px;font-weight:700;margin-bottom:14px;color:var(--blue)}
.kw-popup .kw-insight{
  margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(0,0,0,.06);
}
.kw-popup .kw-insight:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.kw-popup .kw-point{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:4px}
.kw-popup .kw-source{font-size:12px;color:var(--text-light)}
.kw-popup .kw-source a:hover{text-decoration:underline}
.kw-popup-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;
  border:none;cursor:pointer;background:rgba(0,0,0,.06);font-size:14px;
  display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
}

/* Tooltip for edges */
.edge-tooltip{
  position:fixed;z-index:999;background:rgba(0,0,0,.8);color:#fff;
  padding:8px 14px;border-radius:8px;font-size:12px;pointer-events:none;
  max-width:300px;display:none;line-height:1.5;
}


/* ===== NETWORK FILTER ===== */
.network-filter-bar{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;
}
.network-filter-bar .nf-tag{
  padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
  font-size:12px;font-weight:500;font-family:inherit;
  background:rgba(0,0,0,.05);color:var(--text-secondary);
  transition:all .25s;
}
.network-filter-bar .nf-tag.active{color:#fff}
.network-filter-bar .nf-tag[data-cat="全部"].active{background:#1a1a2e}
.network-filter-bar .nf-tag[data-cat="心理学"].active{background:#2B7FD8}
.network-filter-bar .nf-tag[data-cat="个人成长"].active{background:#F4D758;color:#5a4a00}
.network-filter-bar .nf-tag[data-cat="商业"].active{background:#4A9FD8}
.network-filter-bar .nf-tag[data-cat="设计"].active{background:#7AB8E8;color:#1a4a70}
.network-filter-bar .nf-tag[data-cat="女性"].active{background:#E8C84A;color:#5a4a00}
.network-filter-bar .nf-tag[data-cat="文学"].active{background:#5BAFD0}

/* ===== TAB CONTENT ===== */
.tab-content{display:none}
.tab-content.active{display:block}

/* Scrollbar */
.modal-overlay::-webkit-scrollbar{width:4px}
.modal-overlay::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px}
.kw-popup::-webkit-scrollbar{width:4px}
.kw-popup::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px}
</style>

<style>
@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 400 700;
  src: url('./fonts/playfair-display-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Playfair Display';
  font-style: italic;
  font-weight: 400;
  src: url('./fonts/playfair-display-italic-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 400 700;
  src: url('./fonts/dm-sans-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: italic;
  font-weight: 400;
  src: url('./fonts/dm-sans-italic-latin.woff2') format('woff2');
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <img class="header-avatar" src="./avatar.png" alt="avatar">
    <span class="header-title">Esther's Bookshelf</span>
  </div>
  <div class="header-tabs">
    <button class="tab-btn active" data-tab="shelf">📖 书架</button>
    <button class="tab-btn" data-tab="network">🕸️ 观点网络</button>
    <button class="add-book-btn" id="addBookBtn">+ 添加新书</button>
  </div>
</header>

<!-- Main -->
<div class="main">
  <div id="tab-shelf" class="tab-content active"></div>
  <div id="tab-network" class="tab-content">
    <div class="network-filter-bar" id="networkFilterBar"></div>
    <div class="network-container">
      <svg class="network-svg"></svg>
    </div>
  </div>
</div>

<!-- Book Detail Modal -->
<div class="modal-overlay" id="bookModal">
  <button class="close-btn" id="modalClose">&times;</button>
  <div class="book-scroll" id="bookScrollContent"></div>
</div>

<!-- Add Book Modal -->
<div class="add-modal-overlay" id="addBookModal">
  <div class="add-modal">
    <button class="close-add" id="closeAddModal">&times;</button>
    <h2>📚 添加新书</h2>
    <label for="newBookTitle">书名 *</label>
    <input type="text" id="newBookTitle" placeholder="输入书名…">
    <label for="newBookAuthor">作者（选填）</label>
